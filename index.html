<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせ</title>
</head>
<body>
  <h2>お問い合わせフォーム</h2>

  <!-- FormSubmit を使う -->
  <form action="https://formsubmit.co/tokuko534@gmail.com" method="POST">
    <label>お名前:<br>
      <input type="text" name="name" required>
    </label>
    <br><br>

    <label>メールアドレス:<br>
      <input type="email" name="email" required>
    </label>
    <br><br>

    <label>メッセージ:<br>
      <textarea name="message" rows="5" required></textarea>
    </label>
    <br><br>

    <button type="submit">送信</button>
  </form>
</body>
</html>
